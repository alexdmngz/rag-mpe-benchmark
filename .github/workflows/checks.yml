name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-check.txt
      - run: python -m pip install -r requirements-check.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/Script.py --mode prepare
      - run: python src/Script.py --mode bm25 --limit 3
